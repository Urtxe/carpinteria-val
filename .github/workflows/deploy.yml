name: Publicar web estática

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Comprobar HTML y recursos locales
        run: python scripts/check_site.py
      - name: Preparar únicamente los archivos públicos
        run: |
          mkdir _site
          cp index.html style.css script.js LICENSE _site/
          cp -r img _site/
          rm _site/img/portada.png
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
